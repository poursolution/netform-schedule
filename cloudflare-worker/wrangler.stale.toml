#:schema node_modules/wrangler/config-schema.json
name = "kapt-verify-worker"
main = "src/index.js"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 환경 변수 (실제 값은 wrangler secret put 으로 등록)
# DATA_GO_KR_KEY    : data.go.kr 서비스 키
# JANDI_WEBHOOK_URL : 잔디 Incoming Webhook URL (검증 실패 시 알림)
# OUR_COMPANY_NAMES : 우리 회사 낙찰자 매칭용 명칭 (콤마 구분, 예: 넷폼,(주)넷폼,POUR솔루션,아파트스퀘어)

[vars]
OUR_COMPANY_NAMES = "넷폼,(주)넷폼,넷폼R&D,(주)넷폼R&D,POUR솔루션,(주)POUR솔루션,아파트스퀘어,(주)아파트스퀘어,POUR,넷폼알엔디"

# Cron trigger:
#   1) 매일 02:00 KST (= 17:00 UTC) K-APT 신규 공고 수집
#   2) 매주 월요일 09:00 KST (= 00:00 UTC) → 분기 마지막월(3/6/9/12) 마지막주 월요일만 분기정산 실행
#   3) 매일 09:00 KST (= 00:00 UTC) · 17:00 KST (= 08:00 UTC) — 분기 확인 리마인드 (deadline 내 미확인만)
#   4) 업무시간 09:00~19:00 KST 두 시간 간격 — 잔디 공고 수집 + PT 재매칭
[triggers]
crons = ["0 17 * * *", "0 0 * * 1", "0 0,8 * * *", "15 0 * * *", "*/15 * * * *", "0 0,2,4,6,8,10 * * *"]
# 추가 "*/15 * * * *" — 15분마다 VPS(kapt-playwright-server) /health 감시.
#   응답 없으면(연속 2회≈30분) 잔디로 다운 알림, 복구되면 복구 알림. 상태는 Firebase config/vpsHealth 보존.
# 추가 "15 0 * * *" — 매일 09:15 KST 백업 cron (09:00 영업회의 알림 누락 대비, notifyLog 멱등성으로 중복 발송 방지)
# 추가 "0 0,2,4,6,8,10 * * *" — 09/11/13/15/17/19시 KST 잔디 첨부파일 증분 수집.

[observability]
enabled = true

# Browser Rendering (Paid plan 필수 — K-APT PDF 다운로드용)
[browser]
binding = "BROWSER"

# Workers AI — 스크린샷 검증용 (Vision 모델로 단지명 + POUR 키워드 추출)
[ai]
binding = "AI"

# CORS: 단일 환경(top-level)으로 통일 — 과거 [env.production] 은 배포 모호성(Multiple environments
# 경고로 deploy 중단)만 유발하고 라이브(top-level) 에는 적용되지도 않아 제거함.
# ALLOWED_ORIGIN 미설정 시 코드가 '*' 로 동작(기존 라이브와 동일).
